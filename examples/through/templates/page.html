<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>through</title>
  <script type="module" src="{{ datastar | safe }}"></script>
  <link rel="stylesheet" href="/static/through.css?v=26">
</head>
<body data-init="@get('/sse')">
  <div class="scene">
    <div class="orbit">
      <div class="stage">
        <div class="slab pane" data-pane="p1">
          <div class="face front">
            <div class="scroll"><div id="grid-p1">connecting...</div></div>
          </div>
          <div class="face back" aria-hidden="true"></div>
          <div class="face west" aria-hidden="true"></div>
          <div class="face east" aria-hidden="true"></div>
          <div class="caption pane-cap">static HTML</div>
        </div>
        <div class="lamp" aria-hidden="true"></div>
        <div class="light" aria-hidden="true">
          <div class="light-top"></div>
          <div class="light-bot"></div>
          <div class="light-west"></div>
          <div class="light-east"></div>
        </div>
        <div id="beam" aria-hidden="true"></div>
        <div class="wez">
          <div class="wez-front">
            <div class="wez-screen" aria-hidden="true"></div>
          </div>
          <div class="wez-back" aria-hidden="true"></div>
        </div>
        <div class="wez-label">wezterm</div>
      </div>
    </div>
  </div>
  <div id="chrome">
    <button type="button" id="toggle" aria-pressed="false">see through</button>
    <a href="/shots" id="shots-link">shots</a>
    <span id="link"
      data-signals="{ping: 0, _rtt: 0, _missed: 0}"
      data-init__delay.500ms="$_missed++; $ping = Date.now(); @post('/ping')"
      data-on-interval__duration.2s="$_missed++; $ping = Date.now(); @post('/ping')"
      data-on-signal-patch-filter="{include: /^pong$/}"
      data-on-signal-patch="$_missed = 0; $_rtt = Date.now() - $pong"
      data-class:offline="$_missed > 2"
      data-text="$_missed > 2 ? 'offline' : $_rtt + 'ms'"
    >--</span>
  </div>
  <script type="module" src="/static/through.js?v=19"></script>
</body>
</html>
