[package]
name = "ptyZZZ"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "A terminal as a unix pipe: pty in, JSONL screen frames out"
repository = "https://github.com/cablehead/ptyZZZ"

[[bin]]
name = "ptyZZZ"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rio-vt = "0.5"
# Implicit URL detection (rio has no built-in rule scan); rio-vt already
# pulls regex transitively, so this adds no new build unit.
regex = "1"

[dev-dependencies]
brotli = "8"

[profile.release]
opt-level = 2
