[package]
name = "ptyZZZ"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "A terminal as a unix pipe: pty in, JSONL screen frames out"
repository = "https://github.com/cablehead/ptyZZZ"

[[bin]]
name = "ptyZZZ"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }
# Pinned to the same rev as wezterm-term: provides hyperlink::Rule and the
# default URL patterns for implicit link detection (wezterm-term re-exports
# Line but not the rules).
wezterm-surface = { git = "https://github.com/wezterm/wezterm", rev = "577474d89ee61aef4a48145cdec82a638d874751" }

[dev-dependencies]
brotli = "8"

[profile.release]
opt-level = 2
